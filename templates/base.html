<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reward Tokens{% endblock %}</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --brand:#e2552b; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --grey:#6b7280; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:0 16px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  header .logo { font-weight:700; padding:14px 0; }
  header nav { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  header nav a { color:#cbd2dc; text-decoration:none; padding:16px 12px; border-bottom:3px solid transparent; }
  header nav a.on { color:#fff; border-color:var(--brand); }
  header .who { font-size:13px; color:#cbd2dc; }
  header .who a { color:#fff; margin-left:8px; }
  main { max-width:980px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 16px; } h2 { font-size:17px; margin:0 0 12px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px){ .row { grid-template-columns:1fr; } }
  button, .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:8px;
           padding:11px 18px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; }
  button.secondary, .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:700; color:#fff; }
  .pill.active{background:var(--ok)} .pill.claimed{background:var(--warn)} .pill.void,.pill.expired{background:var(--grey)}
  .err { color:var(--bad); margin-top:10px; }
  code { font-family:ui-monospace,Consolas,monospace; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="logo">🎁 Reward Tokens</div>
  <nav>
    <a href="/" class="{{ 'on' if page=='issue' }}">Generate Token</a>
    <a href="/verify" class="{{ 'on' if page=='verify' }}">Admin: Scan &amp; Verify</a>
    <a href="/tokens" class="{{ 'on' if page=='tokens' }}">All Tokens</a>
  </nav>
  <div class="who">Outlet: <b>{{ session.outlet }}</b><a href="/logout">Logout</a></div>
</header>
<main>{% block body %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
